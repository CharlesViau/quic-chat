[package]
name = "quic-chat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "time"] }
